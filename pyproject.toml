[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-unlocker"
version = "2.2.1"
description = "Bedrock Achievement Reactivator by @Heartzin - Heart Unlocker"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["amulet-nbt", "amulet-core"]
license = { text = "GPL-3.0" }
authors = [{ name = "Heartzin", email = "heartzin@telegram.me" }]
keywords = ["minecraft", "bedrock", "achievements"]

[project.scripts]
heart-unlocker = "heart_unlocker:main"
heartzin-unlocker = "heart_unlocker:main"

[project.urls]
Homepage = "https://github.com/Hearttsu63/HeartzinUnlocker"
Repository = "https://github.com/Hearttsu63/HeartzinUnlocker"

[tool.setuptools]
py-modules = ["reativar_conquistas", "heart_unlocker"]
